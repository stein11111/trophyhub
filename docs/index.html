<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vice Tracker">
<meta name="theme-color" content="#0b0614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Vice Tracker</title>
<style>
:root{
  --bg:#0b0614; --card:#160d24; --card2:#1d1230; --line:#2c1d44;
  --txt:#f6eefe; --mute:#a593c2;
  --pink:#ff2e88; --orange:#ff9a3c; --teal:#20e3d2; --purple:#9b5cff;
  --plat:#cfe3ff; --gold:#ffcc4d; --silver:#c9cfd8; --bronze:#d08a55;
  --sun:linear-gradient(135deg,#ff2e88 0%,#ff6a5c 50%,#ffb347 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:-30% -30% auto -30%;height:70vh;background:radial-gradient(closest-side,rgba(255,46,136,.28),transparent),radial-gradient(closest-side at 80% 40%,rgba(32,227,210,.18),transparent);filter:blur(30px);pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px}
.who span{font-size:12px;color:var(--mute)}
.lvl{font-size:12px;padding:6px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.lvl b{color:var(--teal)}
.demo{background:rgba(255,154,60,.12);border:1px solid rgba(255,154,60,.4);color:#ffd2a6;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.view{display:none;animation:in .35s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{position:relative;border-radius:26px;padding:22px 20px 20px;overflow:hidden;background:linear-gradient(180deg,#2a0f3d 0%,#150a25 70%);border:1px solid var(--line)}
.hero:before{content:"";position:absolute;left:50%;bottom:-120px;width:340px;height:340px;transform:translateX(-50%);border-radius:50%;background:var(--sun);opacity:.22;filter:blur(8px);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px);mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px)}
.hero h1{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}
.title{font-size:30px;font-weight:900;margin:4px 0 16px;background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
.ringwrap{position:relative;display:flex;align-items:center;gap:18px}
.ring{width:136px;height:136px;flex:none}
.ringwrap{gap:14px}
.ring .pct{font-size:38px;font-weight:900;fill:var(--txt)}
.ring .sub{font-size:11px;fill:var(--mute);letter-spacing:.12em}
.tcount{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.tc{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:8px 9px;white-space:nowrap;min-width:0}
.tc i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:2px}
.tc b{font-size:17px}
.tc small{font-size:11px}
.tc span{display:block;font-size:11px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--mute)}
h2{font-size:15px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:500;color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.chart{width:100%;height:150px;display:block}
.tro{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.tro img,.tro .ph{width:52px;height:52px;border-radius:12px;flex:none;object-fit:cover;background:var(--card2)}
.tro.off img{filter:grayscale(1) brightness(.55)}
.tro .ph{display:grid;place-items:center;font-size:22px}
.tro .t{flex:1;min-width:0}
.tro .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tro .t .ds{display:block;font-size:12px;color:var(--mute);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tro .m{text-align:right;font-size:11px;color:var(--mute);flex:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.rare{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;background:var(--card2)}
.check{color:var(--teal);font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:8px 14px;font-size:13px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--sun);border-color:transparent;color:#1a0610}
input.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;margin-bottom:10px;outline:none}
.game{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.game img,.game .ph{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--card2)}
.game .t{flex:1;min-width:0}
.game b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:9px;background:var(--card2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:9px}
.game small{font-size:11px;color:var(--mute)}
.game .p{font-weight:800;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(11,6,20,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:170px;background:none;border:0;color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:14px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--txt);background:var(--card2)}
nav button.on svg{stroke:var(--pink)}
.foot{text-align:center;color:var(--mute);font-size:11px;margin:18px 0 6px}
.empty{color:var(--mute);text-align:center;padding:30px 10px;font-size:14px}
.next{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.nx{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.nx img,.nx .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--card2);display:grid;place-items:center;filter:grayscale(.6)}
.nx b{display:block;font-size:13px;margin-top:8px;line-height:1.25;height:33px;overflow:hidden}
.nx span{font-size:11px;color:var(--teal);font-weight:700}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet img{width:96px;height:96px;border-radius:18px;display:block;margin:0 auto 12px}
.sheet h3{text-align:center;margin:0 0 6px}
.sheet p{text-align:center;color:var(--mute);margin:0 0 14px;font-size:14px;line-height:1.45}
.sheet .row{display:flex;justify-content:space-around;font-size:13px}
.sheet .row div{text-align:center}
.sheet .row b{display:block;font-size:16px}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <header>
    <div class="avatar" id="avatar">V</div>
    <div class="who"><b id="name">Spieler</b><span id="updated">lädt …</span></div>
    <div class="lvl">Level <b id="level">–</b></div>
  </header>
  <div class="demo" id="demo" hidden>Demo-Ansicht: Sobald dein PlayStation-Konto verbunden ist, siehst du hier deine echten Trophäen.</div>

  <!-- GTA 6 -->
  <section class="view on" id="v-home">
    <div class="hero">
      <h1>Dein Fortschritt</h1>
      <div class="title">GTA VI</div>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 150 150">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e88"/><stop offset=".55" stop-color="#ff6a5c"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs>
          <circle cx="75" cy="75" r="62" fill="none" stroke="#2c1d44" stroke-width="12"/>
          <circle id="arc" cx="75" cy="75" r="62" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 75 75)" stroke-dasharray="389.6" stroke-dashoffset="389.6" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>
          <text x="75" y="80" text-anchor="middle" class="pct" id="pct">0%</text>
          <text x="75" y="100" text-anchor="middle" class="sub">TROPHÄEN</text>
        </svg>
        <div class="tcount" id="tcount"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-earned">–</b><span>geschafft</span></div>
      <div class="stat"><b id="s-time">–</b><span>gespielt</span></div>
      <div class="stat"><b id="s-week">–</b><span>diese Woche</span></div>
    </div>
    <h2>Als Nächstes holen <small>am häufigsten geschafft</small></h2>
    <div class="next" id="next"></div>
    <h2>Verlauf <small id="histinfo"></small></h2>
    <div class="card"><svg class="chart" id="chart" viewBox="0 0 320 150" preserveAspectRatio="none"></svg></div>
    <h2>Zuletzt freigeschaltet</h2>
    <div id="recent"></div>
  </section>

  <!-- Trophäen -->
  <section class="view" id="v-tro">
    <h2 style="margin-top:4px">Alle GTA-VI-Trophäen <small id="trocount"></small></h2>
    <input class="search" id="q" placeholder="Trophäe suchen …" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <!-- Spiele -->
  <section class="view" id="v-games">
    <h2 style="margin-top:4px">Alle Spiele <small id="gcount"></small></h2>
    <div id="games"></div>
  </section>

  <div class="foot" id="foot"></div>
</main>

<nav>
  <button class="on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Fortschritt</button>
  <button data-v="tro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Trophäen</button>
  <button data-v="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/></svg>Spiele</button>
</nav>

<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>

<script>
const COL = {platinum:"var(--plat)",gold:"var(--gold)",silver:"var(--silver)",bronze:"var(--bronze)"};
const NAMES = {platinum:"Platin",gold:"Gold",silver:"Silber",bronze:"Bronze"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMin = (m) => !m ? "–" : m < 60 ? m + " Min" : Math.floor(m/60) + " Std";
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "";
const ago = (d) => { const s=(Date.now()-new Date(d))/1000; if(s<3600) return "vor "+Math.max(1,Math.round(s/60))+" Min"; if(s<86400) return "vor "+Math.round(s/3600)+" Std"; return "vor "+Math.round(s/86400)+" Tagen"; };
const rareTxt = (r) => r==null ? "" : r < 5 ? "Ultra selten" : r < 15 ? "Sehr selten" : r < 50 ? "Selten" : "Häufig";

function demoData(){
  const types=["bronze","bronze","bronze","silver","bronze","gold","bronze","silver","bronze","bronze","silver","gold","bronze","bronze","silver","bronze","bronze","gold","bronze","silver","bronze","bronze","silver","bronze","gold","bronze","silver","bronze","bronze","bronze","silver","bronze","bronze","gold","bronze","silver","bronze","bronze","bronze","platinum"];
  const now=Date.now();
  const trophies=types.map((t,i)=>{const earned=i<15;return{id:i,name:"Demo-Trophäe "+(i+1),detail:"Hier steht später die echte Beschreibung der Trophäe.",type:t,icon:null,earned,earnedAt:earned?new Date(now-(15-i)*86400000*0.8).toISOString():null,rarity:Math.round((90-i*2.1)*10)/10}});
  const hist=[];for(let d=14;d>=0;d--){const e=Math.max(0,Math.round(15-d*1.0));hist.push({day:new Date(now-d*86400000).toISOString().slice(0,10),gtaEarned:e,gta:Math.round(e/40*100*0.8)})}
  return {data:{updated:new Date().toISOString(),demo:true,profile:{onlineId:"Lukas",level:212},gta:{name:"Grand Theft Auto VI",progress:31,minutes:1630,trophies},games:[{name:"Grand Theft Auto VI",progress:31,minutes:1630,earned:{platinum:0,gold:2,silver:4,bronze:9}},{name:"Demo-Spiel 2",progress:64,minutes:2400,earned:{platinum:0,gold:3,silver:7,bronze:20}},{name:"Demo-Spiel 3",progress:100,minutes:5100,earned:{platinum:1,gold:6,silver:12,bronze:30}}]},hist};
}

async function load(){
  try{
    const [d,h]=await Promise.all([fetch("data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch("history.json?"+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[])]);
    return {data:d,hist:h};
  }catch{ return demoData(); }
}

let D,H,filter="all";
function render(){
  const p=D.profile||{}, g=D.gta;
  $("#demo").hidden=!D.demo;
  $("#name").textContent=p.onlineId||"Spieler";
  $("#avatar").innerHTML=p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc((p.onlineId||"V")[0].toUpperCase());
  $("#level").textContent=p.level??"–";
  $("#updated").textContent=D.updated?"aktualisiert "+ago(D.updated):"";
  $("#foot").textContent=D.demo?"Demo-Daten":"Daten vom PlayStation Network · aktualisiert sich automatisch";

  if(!g){ $("#v-home").innerHTML=`<div class="empty">GTA VI wurde auf deinem Konto noch nicht gefunden.<br>Starte das Spiel einmal auf der PS5 – danach taucht es hier auf.</div>`; }
  else{
    const tr=g.trophies||[], done=tr.filter(t=>t.earned);
    setTimeout(()=>{$("#arc").style.strokeDashoffset=389.6*(1-(g.progress||0)/100)},80);
    countUp($("#pct"),g.progress||0,"%");
    $("#tcount").innerHTML=["platinum","gold","silver","bronze"].map(t=>{const all=tr.filter(x=>x.type===t).length;const e=done.filter(x=>x.type===t).length;return `<div class="tc"><i style="background:${COL[t]}"></i><b>${e}</b><small style="color:var(--mute)">/${all}</small><span>${NAMES[t]}</span></div>`}).join("");
    $("#s-earned").textContent=done.length+"/"+tr.length;
    $("#s-time").textContent=fmtMin(g.minutes);
    const week=done.filter(t=>t.earnedAt&&Date.now()-new Date(t.earnedAt)<7*864e5).length;
    $("#s-week").textContent="+"+week;
    const nx=tr.filter(t=>!t.earned&&t.type!=="platinum").sort((a,b)=>(b.rarity??0)-(a.rarity??0)).slice(0,8);
    $("#next").innerHTML=nx.length?nx.map(t=>`<div class="nx" data-id="${t.id}">${t.icon?`<img src="${esc(t.icon)}" alt="">`:`<div class="ph">🏆</div>`}<b>${t.hidden&&!t.earned?"Versteckte Trophäe":esc(t.name)}</b><span>${t.rarity!=null?t.rarity+" % haben sie":""}</span></div>`).join(""):`<div class="empty" style="padding:10px">Alles geholt! 👑</div>`;
    const rec=[...done].sort((a,b)=>new Date(b.earnedAt)-new Date(a.earnedAt)).slice(0,5);
    $("#recent").innerHTML=rec.length?rec.map(row).join(""):`<div class="empty">Noch keine Trophäe – leg los!</div>`;
    chart();
  }
  // Trophäen-Liste
  const tr=(g&&g.trophies)||[];
  $("#trocount").textContent=tr.filter(t=>t.earned).length+" von "+tr.length;
  const chips=[["all","Alle"],["open","Offen"],["done","Geschafft"],["platinum","Platin"],["gold","Gold"],["silver","Silber"],["bronze","Bronze"],["rare","Selten"]];
  $("#chips").innerHTML=chips.map(([k,l])=>`<button class="chip ${k===filter?"on":""}" data-f="${k}">${l}</button>`).join("");
  list();
  // Spiele
  const gs=[...(D.games||[])].sort((a,b)=>new Date(b.lastPlayed||0)-new Date(a.lastPlayed||0));
  $("#gcount").textContent=gs.length+" Spiele";
  $("#games").innerHTML=gs.map(x=>{const e=x.earned||{};return `<div class="game">${x.icon?`<img src="${esc(x.icon)}" alt="" loading="lazy">`:`<div class="ph"></div>`}<div class="t"><b>${esc(x.name)}</b><small>${["platinum","gold","silver","bronze"].map(t=>`<span class="dot" style="background:${COL[t]};width:8px;height:8px"></span> ${e[t]||0}`).join(" &nbsp;")}${x.minutes?" · "+fmtMin(x.minutes):""}</small><div class="bar"><i style="width:${x.progress||0}%"></i></div></div><div class="p">${x.progress||0}%</div></div>`}).join("")||`<div class="empty">Keine Spiele gefunden.</div>`;
}

function row(t){
  const hid=t.hidden&&!t.earned;
  return `<div class="tro ${t.earned?"":"off"}" data-id="${t.id}">${t.icon?`<img src="${esc(t.icon)}" alt="" loading="lazy">`:`<div class="ph">🏆</div>`}<div class="t"><b><span class="dot" style="background:${COL[t.type]}"></span> ${hid?"Versteckte Trophäe":esc(t.name)}</b><span class="ds">${hid?"Spiel weiter, um sie aufzudecken.":esc(t.detail)}</span>${t.rarity!=null?`<span class="rare">${rareTxt(t.rarity)} · ${t.rarity} %</span>`:""}</div><div class="m">${t.earned?`<div class="check">✓</div>${fmtDate(t.earnedAt)}`:""}</div></div>`;
}

function list(){
  const q=$("#q").value.trim().toLowerCase();
  let tr=((D.gta&&D.gta.trophies)||[]).slice();
  if(filter==="open") tr=tr.filter(t=>!t.earned);
  else if(filter==="done") tr=tr.filter(t=>t.earned);
  else if(filter==="rare") tr=tr.filter(t=>t.rarity!=null&&t.rarity<15).sort((a,b)=>a.rarity-b.rarity);
  else if(NAMES[filter]) tr=tr.filter(t=>t.type===filter);
  if(q) tr=tr.filter(t=>!(t.hidden&&!t.earned)&&(t.name+" "+t.detail).toLowerCase().includes(q));
  $("#list").innerHTML=tr.map(row).join("")||`<div class="empty">Nichts gefunden.</div>`;
}

function chart(){
  const svg=$("#chart"); const h=(H||[]).filter(x=>x.gtaEarned!=null);
  if(h.length<2){ svg.innerHTML=`<text x="160" y="80" text-anchor="middle" fill="#a593c2" font-size="12">Der Verlauf füllt sich ab morgen</text>`; $("#histinfo").textContent=""; return; }
  const W=320,Hh=150,pad=14, max=Math.max(...h.map(x=>x.gtaEarned),1);
  const pts=h.map((x,i)=>[pad+i*(W-2*pad)/(h.length-1), Hh-pad-(x.gtaEarned/max)*(Hh-2*pad)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  svg.innerHTML=`<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2e88" stop-opacity=".45"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/></linearGradient><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#20e3d2"/><stop offset="1" stop-color="#ff2e88"/></linearGradient></defs>
  <path d="${d} L${pts.at(-1)[0]} ${Hh} L${pts[0][0]} ${Hh}Z" fill="url(#fill)"/>
  <path d="${d}" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="4" fill="#ff2e88"/>`;
  $("#histinfo").textContent="Trophäen · letzte "+h.length+" Tage";
}

function countUp(el,to,suf){let s=null;const step=(t)=>{if(!s)s=t;const k=Math.min(1,(t-s)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

function openSheet(id){
  const t=((D.gta&&D.gta.trophies)||[]).find(x=>String(x.id)===String(id)); if(!t) return;
  const hid=t.hidden&&!t.earned;
  $("#sheetin").innerHTML=`${t.icon?`<img src="${esc(t.icon)}" alt="" style="${t.earned?"":"filter:grayscale(1) brightness(.6)"}">`:`<div style="font-size:60px;text-align:center">🏆</div>`}<h3>${hid?"Versteckte Trophäe":esc(t.name)}</h3><p>${hid?"Diese Trophäe ist versteckt, bis du sie freischaltest.":esc(t.detail)}</p><div class="row"><div><b style="color:${COL[t.type]}">${NAMES[t.type]}</b>Typ</div><div><b>${t.rarity!=null?t.rarity+" %":"–"}</b>Spieler</div><div><b>${t.earned?"✓ "+fmtDate(t.earnedAt):"offen"}</b>Status</div></div>`;
  $("#sheet").classList.add("on");
}

document.addEventListener("click",e=>{
  const nb=e.target.closest("nav button");
  if(nb){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===nb));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+nb.dataset.v));scrollTo({top:0,behavior:"smooth"});return}
  const c=e.target.closest(".chip"); if(c){filter=c.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));list();return}
  const t=e.target.closest("[data-id]"); if(t){openSheet(t.dataset.id);return}
  if(e.target.id==="sheet") $("#sheet").classList.remove("on");
});
$("#q").addEventListener("input",list);

load().then(r=>{D=r.data;H=r.hist||[];render()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
