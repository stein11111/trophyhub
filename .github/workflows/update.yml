name: Trophäen aktualisieren
on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/**]
permissions:
  contents: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Trophäen holen
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: |
          set +e
          node scripts/fetch.mjs > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          node -e "const fs=require('fs');fs.writeFileSync('docs/status.json',JSON.stringify({time:new Date().toISOString(),ok:$code===0,log:fs.readFileSync('/tmp/out.txt','utf8').split(process.env.PSN_NPSSO||'@@none@@').join('***').slice(-1500)}))"
          echo "code=$code" >> $GITHUB_ENV
      - name: Speichern
        run: |
          git config user.name "vice-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json docs/data.json docs/history.json 2>/dev/null || git add docs/status.json
          git diff --cached --quiet || git commit -m "Trophäen aktualisiert"
          git push
      - if: env.code != '0'
        run: exit 1
