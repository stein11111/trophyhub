name: Trophäen aktualisieren
on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/**]
permissions:
  contents: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node scripts/fetch.mjs
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
      - name: Speichern
        run: |
          git config user.name "vice-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/history.json
          git diff --cached --quiet || git commit -m "Trophäen aktualisiert"
          git push
